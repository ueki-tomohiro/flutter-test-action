name: 'build-test'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build: # make sure build/ci work properly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This workflow also runs for releases/*, where a poisoned cache would
      # reach a release build (zizmor: cache-poisoning).
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false
      - run: |
          pnpm install --frozen-lockfile
      - run: |
          pnpm all
  test: # make sure the action works on a clean machine without building
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Report existing files without running flutter test.
      - uses: ./
        with:
          title: 'Report only'
          machinePath: __tests__/data/result.json
          coveragePath: __tests__/data/lcov.info
      # Run the tests through a fake flutter command, so no Flutter SDK is needed.
      - uses: ./
        with:
          title: 'Run (passing)'
          flutterCommand: bash __tests__/data/fake-flutter.sh
          coverage: true
        env:
          FAKE_FLUTTER_OUTPUT: __tests__/data/result.json
          FAKE_FLUTTER_LCOV: __tests__/data/lcov.info
      - id: failing
        uses: ./
        with:
          title: 'Run (failing)'
          flutterCommand: bash __tests__/data/fake-flutter.sh
          failOnError: false
          # Without a token, the expected failure does not show up as a failed
          # check or comment on the pull request.
          token: ''
        env:
          FAKE_FLUTTER_OUTPUT: __tests__/data/result_failure.json
          FAKE_FLUTTER_EXIT_CODE: '1'
      - name: Check the outputs of the failing run
        env:
          CONCLUSION: ${{ steps.failing.outputs.conclusion }}
          FAILED: ${{ steps.failing.outputs.failed }}
          EXIT_CODE: ${{ steps.failing.outputs.exit-code }}
        run: |
          test "$CONCLUSION" = failure
          test "$FAILED" = 2
          test "$EXIT_CODE" = 1
